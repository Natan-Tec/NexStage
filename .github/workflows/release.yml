name: Compilar e publicar o instalador

# Envie uma tag como v0.9.0 para compilar tudo e publicar a release com:
#   NexStage-Setup.exe              (Windows)
#   NexStage-Linux-x64.tar.gz       (Linux 64 bits)
#   NexStage-macOS-AppleSilicon.dmg (Mac com chip M1/M2/M3/M4)
#   NexStage-macOS-Intel.dmg        (Mac com processador Intel)
# Também dá para rodar manualmente (Actions > Run workflow):
#  - sem marcar "publicar": só testa a compilação; os arquivos ficam em "Artifacts".
#  - marcando "publicar": cria a tag vX.Y.Z (a versão do código) e a release com os arquivos.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a release no GitHub (cria a tag da versão do código)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler a versão do NexStage
        id: ver
        run: |
          VERSION=$(python -c "import server; print(server.APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NexStage $VERSION"
          test -f "CHANGELOG-$VERSION.md" || { echo "Falta o arquivo CHANGELOG-$VERSION.md"; exit 1; }

      - name: Conferir se a tag bate com a versão do código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão do código (v${{ steps.ver.outputs.version }})."
            echo "Atualize APP_VERSION em server.py e windows_launcher.py, ou use a tag certa."
            exit 1
          fi

  windows-installer:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as ferramentas de compilação
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Rodar os testes
        run: python -m unittest discover -s tests -v

      - name: Gerar o NexStage.exe (sem janela de terminal)
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --noupx \
            --name NexStage \
            --icon "web/favicon.ico" \
            --version-file "packaging/windows/version_info.txt" \
            --contents-directory app \
            --add-data "web;web" \
            --hidden-import pystray._win32 \
            --collect-all imageio_ffmpeg \
            windows_launcher.py
          cp README.md LICENSE.txt dist/NexStage/
          cp "CHANGELOG-${{ needs.prepare.outputs.version }}.md" dist/NexStage/

      - name: Instalar o Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup 6 não foi encontrado." }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Criar o instalador NexStage-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "$env:ISCC" "packaging\windows\NexStage.iss"
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou." }
          if (-not (Test-Path "release\NexStage-Setup.exe")) { throw "release\NexStage-Setup.exe não foi gerado." }
          Get-Item "release\NexStage-Setup.exe" | Select-Object Name, Length

      - name: Guardar o instalador (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NexStage-Setup
          path: release/NexStage-Setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    # Ubuntu 22.04 (glibc mais antiga) roda também em distribuições mais velhas.
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as ferramentas de compilação
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Rodar os testes
        run: python -m unittest discover -s tests -v

      - name: Gerar o programa para Linux
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --noupx \
            --name NexStage \
            --add-data "web:web" \
            --hidden-import pystray._xorg \
            --collect-all imageio_ffmpeg \
            --collect-submodules Xlib \
            desktop_launcher.py

      - name: Montar a pasta de distribuição
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open("web/favicon.ico")
          try:
              image.size = max(image.ico.sizes())
          except Exception:
              pass
          image.convert("RGBA").save("dist/NexStage/NexStage.png")
          PY
          cp packaging/linux/instalar.sh packaging/linux/desinstalar.sh packaging/linux/LEIA-ME.txt dist/NexStage/
          cp README.md LICENSE.txt dist/NexStage/
          cp "CHANGELOG-${{ needs.prepare.outputs.version }}.md" dist/NexStage/
          chmod +x dist/NexStage/NexStage dist/NexStage/instalar.sh dist/NexStage/desinstalar.sh

      - name: Testar o programa compilado (abre, responde e encerra)
        timeout-minutes: 4
        run: |
          export NEXSTAGE_HOME="$RUNNER_TEMP/nexstage-teste"
          APP="dist/NexStage/NexStage"
          LOG="$RUNNER_TEMP/nexstage-teste.log"
          fail() { echo "::error::$1 | $(tail -c 900 "$LOG" 2>/dev/null | tr '\n' ' ')"; exit 1; }
          echo "--- componentes da bandeja"
          xvfb-run -a "$APP" --check-tray > "$LOG" 2>&1 || fail "componentes da bandeja ausentes"
          cat "$LOG"
          echo "--- iniciar"
          xvfb-run -a "$APP" --no-browser > "$LOG" 2>&1 &
          for i in $(seq 1 80); do
            [ -f "$NEXSTAGE_HOME/data/runtime.json" ] && break
            sleep 0.5
          done
          [ -f "$NEXSTAGE_HOME/data/runtime.json" ] || fail "o programa não iniciou a tempo"
          PORT=$(python -c "import json,os;print(json.load(open(os.environ['NEXSTAGE_HOME']+'/data/runtime.json'))['port'])")
          curl -fsS "http://127.0.0.1:$PORT/api/bootstrap" > "$RUNNER_TEMP/boot.json" || fail "o servidor não respondeu"
          python -c "import sys,json; d=json.load(open(sys.argv[1])); print('app:', d['app']['name'], d['app']['version']); assert d['app']['version']=='${{ needs.prepare.outputs.version }}'" "$RUNNER_TEMP/boot.json" || fail "versão errada no programa compilado"
          curl -fsS -o /dev/null "http://127.0.0.1:$PORT/bible-ref.js" || fail "arquivos da interface ausentes"
          xvfb-run -a "$APP" --stop || fail "não encerrou"
          wait

      - name: Compactar
        run: |
          mkdir -p release
          tar -czf release/NexStage-Linux-x64.tar.gz -C dist NexStage
          ls -l release

      - name: Guardar o pacote (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NexStage-Linux
          path: release/NexStage-Linux-x64.tar.gz
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as ferramentas de compilação
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Rodar os testes
        run: python -m unittest discover -s tests -v

      - name: Gerar o NexStage.app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --noupx \
            --name NexStage \
            --icon "web/favicon.ico" \
            --osx-bundle-identifier br.com.natangabriel.nexstage \
            --add-data "web:web" \
            --hidden-import pystray._darwin \
            --collect-all imageio_ffmpeg \
            --hidden-import objc \
            --hidden-import AppKit \
            --hidden-import Foundation \
            --hidden-import Quartz \
            desktop_launcher.py
          PLIST="dist/NexStage.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.prepare.outputs.version }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ needs.prepare.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.prepare.outputs.version }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ needs.prepare.outputs.version }}" "$PLIST"
          # assinatura "ad hoc" (sem conta paga da Apple) para o app abrir em chips Apple Silicon
          codesign --force --deep --sign - dist/NexStage.app
          codesign --verify --deep dist/NexStage.app && echo "assinatura ad hoc ok"

      - name: Testar o aplicativo compilado (abre, responde e encerra)
        timeout-minutes: 4
        run: |
          export NEXSTAGE_HOME="$RUNNER_TEMP/nexstage-teste"
          APP="dist/NexStage.app/Contents/MacOS/NexStage"
          LOG="$RUNNER_TEMP/nexstage-teste.log"
          fail() { echo "::error::$1 | $(tail -c 900 "$LOG" 2>/dev/null | tr '\n' ' ')"; exit 1; }
          echo "--- componentes da barra de menus"
          "$APP" --check-tray > "$LOG" 2>&1 || fail "componentes da bandeja ausentes"
          cat "$LOG"
          echo "--- iniciar"
          "$APP" --no-browser > "$LOG" 2>&1 &
          for i in $(seq 1 240); do
            [ -f "$NEXSTAGE_HOME/data/runtime.json" ] && break
            sleep 0.5
          done
          [ -f "$NEXSTAGE_HOME/data/runtime.json" ] || fail "o programa não iniciou a tempo"
          PORT=$(python -c "import json,os;print(json.load(open(os.environ['NEXSTAGE_HOME']+'/data/runtime.json'))['port'])")
          curl -fsS "http://127.0.0.1:$PORT/api/bootstrap" > "$RUNNER_TEMP/boot.json" || fail "o servidor não respondeu"
          python -c "import sys,json; d=json.load(open(sys.argv[1])); print('app:', d['app']['name'], d['app']['version']); assert d['app']['version']=='${{ needs.prepare.outputs.version }}'" "$RUNNER_TEMP/boot.json" || fail "versão errada no programa compilado"
          curl -fsS -o /dev/null "http://127.0.0.1:$PORT/bible-ref.js" || fail "arquivos da interface ausentes"
          "$APP" --stop || fail "não encerrou"
          wait

      - name: Criar o NexStage-macOS-${{ matrix.arch }}.dmg
        run: |
          mkdir -p release stage
          cp -R dist/NexStage.app stage/
          ln -s /Applications stage/Applications
          cp packaging/macos/LEIA-ME.txt stage/
          hdiutil create -volname "NexStage" -srcfolder stage -ov -format UDZO "release/NexStage-macOS-${{ matrix.arch }}.dmg"
          ls -l release

      - name: Guardar o pacote (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NexStage-macOS-${{ matrix.arch }}
          path: release/NexStage-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: [prepare, windows-installer, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar os arquivos compilados
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Conferir os arquivos
        run: ls -l release

      - name: Publicar a release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NexStage ${{ needs.prepare.outputs.version }}
          body_path: CHANGELOG-${{ needs.prepare.outputs.version }}.md
          files: |
            release/NexStage-Setup.exe
            release/NexStage-Linux-x64.tar.gz
            release/NexStage-macOS-AppleSilicon.dmg
            release/NexStage-macOS-Intel.dmg
          fail_on_unmatched_files: true
